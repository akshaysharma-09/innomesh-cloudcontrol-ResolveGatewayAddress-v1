#
# Auto-labels PRs based on which files changed. Rules live in .github/labeler.yml
# (also synced from ci-workflows). The label inventory is managed by label-sync.yml.

name: labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: [self-hosted, linux, arm64, ecs]
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true
