#
# Trivy security scan — calls the reusable workflow in ci-workflows.
# Runs on every PR (against the PR's diff base) and on push to the default
# branch. Results post to https://trivy.innomesh.au and as PR comments.
# Suppress known CVEs by adding .trivyignore.yaml to the repo root — see
# TRIVY.md (also synced).

name: trivy-scan

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.golangci.yml'
      - 'ruff.toml'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '.github/**'
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.golangci.yml'
      - 'ruff.toml'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    uses: next-mesh/ci-workflows/.github/workflows/trivy-scan.yml@main
    secrets: inherit
