#### UPDATES MUST BE DONE IN THE CI-WORKFLOWS REPO - OR YOUR CHANGES WILL BE LOST ####
#### https://github.com/next-mesh/ci-workflows ####
#
# Scans the diff in every PR for committed secrets using gitleaks.
# Findings appear as inline PR annotations and fail the check on hits.
#
# To allowlist a known false-positive, add a `.gitleaks.toml` to the repo root
# or annotate the line with `# gitleaks:allow`.

name: detect-secrets
run-name: "detect-secrets — ${{ github.head_ref || github.ref }}"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.golangci.yml'
      - 'ruff.toml'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, linux, arm64, ecs]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks needs full history to scan past commits

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source=. --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" --verbose --exit-code=1
          else
            gitleaks detect --source=. --verbose --exit-code=1
          fi
